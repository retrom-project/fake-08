name: Retrom Web candidate
on:
  push:
    branches: ['retrom/**']
  pull_request:
concurrency:
  group: retrom-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Give detached PR merge checkouts an explicit candidate branch
        run: |
          if ! git symbolic-ref --quiet HEAD; then
            git switch -c "build/ci-${GITHUB_RUN_ID}"
          fi
      - name: Build and verify the Web ABI
        run: |
          mkdir -p "$RUNNER_TEMP/core-candidate"
          .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/core-candidate"
